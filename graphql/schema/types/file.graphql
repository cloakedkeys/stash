type Fingerprint {
  type: String!
  value: String!
}

type Folder {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder
  "Returns all parent folders in order from immediate parent to top-level"
  parent_folders: [Folder!]!
  zip_file: BasicFile

  "Returns direct sub-folders"
  sub_folders: [Folder!]!

  "If not null, indicates when the folder was detected as missing. Set by the verify files task, cleared when a scan finds it again"
  missing_since: Time

  mod_time: Time!

  created_at: Time!
  updated_at: Time!
}

interface BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  "If not null, indicates when the file was detected as missing. Set by the verify files task, cleared when a scan finds it again"
  missing_since: Time

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  created_at: Time!
  updated_at: Time!
}

type BasicFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  "If not null, indicates when the file was detected as missing. Set by the verify files task, cleared when a scan finds it again"
  missing_since: Time

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  created_at: Time!
  updated_at: Time!
}

type VideoFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  "If not null, indicates when the file was detected as missing. Set by the verify files task, cleared when a scan finds it again"
  missing_since: Time

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  format: String!
  width: Int!
  height: Int!
  duration: Float!
  video_codec: String!
  audio_codec: String!
  frame_rate: Float!
  bit_rate: Int!

  projection: VideoProjection
  stereo_mode: StereoMode
  vr_corrections: VRCorrections
  vr_passthrough: VRPassthrough

  scenes: [Scene!]!

  created_at: Time!
  updated_at: Time!
}

type ImageFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  "If not null, indicates when the file was detected as missing. Set by the verify files task, cleared when a scan finds it again"
  missing_since: Time

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  format: String!
  width: Int!
  height: Int!

  images: [Image!]!

  created_at: Time!
  updated_at: Time!
}

union VisualFile = VideoFile | ImageFile

type AudioFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  format: String!
  duration: Float!
  audio_codec: String!
  sample_rate: Int!
  bit_rate: Int!

  created_at: Time!
  updated_at: Time!
