type GalleryFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  "If not null, indicates when the file was detected as missing. Set by the verify files task, cleared when a scan finds it again"
  missing_since: Time
  
  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  galleries: [Gallery!]!

  created_at: Time!
  updated_at: Time!
}

input MoveFilesInput {
  ids: [ID!]!
  "valid for single or multiple file ids"
  destination_folder: String

  "valid for single or multiple file ids"
  destination_folder_id: ID

  "valid only for single file id. If empty, existing basename is used"
  destination_basename: String
}

input SetFingerprintsInput {
  type: String!
  "a null value will remove the fingerprint"
  value: String
}

input FileSetFingerprintsInput {
  id: ID!
  "only supplied fingerprint types will be modified"
  fingerprints: [SetFingerprintsInput!]!
}

"How each eye's image is mapped for viewing"
enum VideoProjection {
  "flat 2D video"
  FLAT
  "equirectangular projection with unspecified field of view"
  EQUIRECTANGULAR
  "180 degree fisheye mesh"
  FISHEYE
  "190 degree fisheye lens"
  FISHEYE_190
  "200 degree fisheye mesh for the iZugar MKX200 lens"
  MKX200
  "raw MKX200 lens projection"
  MKX200_RAW
  "220 degree fisheye mesh for the iZugar MKX220 lens"
  MKX220
  "220 degree fisheye mesh for the VRCA220 lens"
  VRCA220
  "190 degree fisheye mesh for the Canon RF52 lens"
  RF52
  "180 degree dome projection"
  DOME
  "360 degree spherical projection"
  SPHERE
  CUBEMAP
  RECTILINEAR
}

"How the two eyes' images are laid out in the frame"
enum StereoMode {
  "single image for both eyes"
  MONO
  "side by side, left eye on the left"
  SBS
  "top and bottom, left eye on top"
  TB
  "side by side, right eye on the left"
  SBS_RIGHT
  "squeezed side by side, left eye on the left"
  SBS_SQUEEZED_LEFT
  "squeezed side by side, right eye on the left"
  SBS_SQUEEZED_RIGHT
  "top and bottom, right eye on top"
  TB_RIGHT
  "squeezed top and bottom, left eye on top"
  TB_SQUEEZED_LEFT
  "squeezed top and bottom, right eye on top"
  TB_SQUEEZED_RIGHT
  "custom UV mapping"
  CUV
  "alternating frames, left eye first"
  AF
  "alternating frames, right eye first"
  AF_RIGHT
  "interleaved rows, left eye first"
  INTERLEAVED_ROWS
  "interleaved rows, right eye first"
  INTERLEAVED_ROWS_RIGHT
  "interleaved columns, left eye first"
  INTERLEAVED_COLUMNS
  "interleaved columns, right eye first"
  INTERLEAVED_COLUMNS_RIGHT
}

"Per-video image position and color adjustments"
type VRCorrections {
  horizontal_offset: Float
  vertical_offset: Float
  brightness: Float
  contrast: Float
  saturation: Float
}

type VRChromaKey {
  hue: Float
  saturation: Float
  value: Float
  threshold: Float
  opacity: Float
}

type VRPassthrough {
  chroma_keys: [VRChromaKey!]
  alpha_packed: Boolean
}

input FileSetVRMetadataInput {
  id: ID!
  projection: VideoProjection
  stereo_mode: StereoMode
  vr_corrections: VRCorrectionsInput
  vr_passthrough: VRPassthroughInput
}

input VRCorrectionsInput {
  horizontal_offset: Float
  vertical_offset: Float
  brightness: Float
  contrast: Float
  saturation: Float
}

input VRPassthroughInput {
  chroma_keys: [VRChromaKeyInput!]
  alpha_packed: Boolean
}

input VRChromaKeyInput {
  hue: Float
  saturation: Float
  value: Float
  threshold: Float
  opacity: Float
}

type FindFilesResultType {
  count: Int!

  "Total megapixels of any image files"
  megapixels: Float!
  "Total duration in seconds of any video files"
  duration: Float!

  "Total file size in bytes"
  size: Int!

  files: [BaseFile!]!
}

type FindFoldersResultType {
  count: Int!
  folders: [Folder!]!
}
