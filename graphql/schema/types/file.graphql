type Fingerprint {
  type: String!
  value: String!
}

type Folder {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder
  "Returns all parent folders in order from immediate parent to top-level"
  parent_folders: [Folder!]!
  zip_file: BasicFile

  "Returns direct sub-folders"
  sub_folders: [Folder!]!

  mod_time: Time!

  created_at: Time!
  updated_at: Time!
}

interface BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  created_at: Time!
  updated_at: Time!
}

type BasicFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  created_at: Time!
  updated_at: Time!
}

type VideoFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  format: String!
  width: Int!
  height: Int!
  duration: Float!
  video_codec: String!
  audio_codec: String!
  frame_rate: Float!
  bit_rate: Int!

  projection: VideoProjection
  stereo_mode: StereoMode
  vr_corrections: VRCorrections

  scenes: [Scene!]!

  created_at: Time!
  updated_at: Time!
}

type ImageFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  format: String!
  width: Int!
  height: Int!

  images: [Image!]!

  created_at: Time!
  updated_at: Time!
}

union VisualFile = VideoFile | ImageFile

type GalleryFile implements BaseFile {
  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  galleries: [Gallery!]!

  created_at: Time!
  updated_at: Time!
}

input MoveFilesInput {
  ids: [ID!]!
  "valid for single or multiple file ids"
  destination_folder: String

  "valid for single or multiple file ids"
  destination_folder_id: ID

  "valid only for single file id. If empty, existing basename is used"
  destination_basename: String
}

input SetFingerprintsInput {
  type: String!
  "a null value will remove the fingerprint"
  value: String
}

input FileSetFingerprintsInput {
  id: ID!
  "only supplied fingerprint types will be modified"
  fingerprints: [SetFingerprintsInput!]!
}

"How each eye's image is mapped for viewing"
enum VideoProjection {
  "flat 2D video"
  FLAT
  "equirectangular mesh, 180 or 360 degrees"
  EQUIRECTANGULAR
  "180 degree fisheye mesh"
  FISHEYE
  "200 degree fisheye mesh for the iZugar MKX200 lens"
  MKX200
  "190 degree fisheye mesh for the Canon RF52 lens"
  RF52
  DOME
  CUBEMAP
  RECTILINEAR
}

"How the two eyes' images are laid out in the frame"
enum StereoMode {
  "single image for both eyes"
  MONO
  "side by side, left eye on the left"
  SBS
  "top and bottom, left eye on top"
  TB
  "custom UV mapping"
  CUV
  "alternating frames, left eye first"
  AF
  "interleaved rows, left eye first"
  INTERLEAVED_ROWS
}

"Small per-video adjustments to the image position, as offered by VR players"
type VRCorrections {
  horizontal_offset: Float
  vertical_offset: Float
}

input FileSetVRMetadataInput {
  id: ID!
  projection: VideoProjection
  stereo_mode: StereoMode
  vr_corrections: VRCorrectionsInput
}

input VRCorrectionsInput {
  horizontal_offset: Float
  vertical_offset: Float
}

type FindFilesResultType {
  count: Int!

  "Total megapixels of any image files"
  megapixels: Float!
  "Total duration in seconds of any video files"
  duration: Float!

  "Total file size in bytes"
  size: Int!

  files: [BaseFile!]!
}

type FindFoldersResultType {
  count: Int!
  folders: [Folder!]!
}
