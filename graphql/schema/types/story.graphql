type StoryPathsType {
  "The story's text, served as plain text"
  text: String # Resolver
}

"A story, kept in a text file"
type Story {
  id: ID!
  title: String
  author: String
  source_website: String
  urls: [String!]!
  date: String
  language: String
  details: String
  tagline: String
  "The current user's own rating, expressed as 1-100"
  rating100: Int
  created_at: Time!
  updated_at: Time!

  files: [BasicFile!]!
  paths: StoryPathsType! # Resolver
  tags: [Tag!]!
}

input StoryCreateInput {
  title: String
  author: String
  source_website: String
  urls: [String!]
  date: String
  "The current user's own rating, expressed as 1-100"
  rating100: Int
  language: String
  details: String
  tagline: String
  tag_ids: [ID!]

  """
  The first id will be assigned as primary.
  Files must not already be primary for another object.
  """
  file_ids: [ID!]
}

input StoryUpdateInput {
  id: ID!
  title: String
  author: String
  source_website: String
  urls: [String!]
  date: String
  "The current user's own rating, expressed as 1-100"
  rating100: Int
  language: String
  details: String
  tagline: String
  tag_ids: [ID!]

  primary_file_id: ID
}

input StoriesDestroyInput {
  "Removes the stories from the library. Their files are kept unless delete_file is set, so the next scan adds them again."
  ids: [ID!]!
  "Also deletes the stories' files, unless another story uses them. A file inside a zip only loses its record."
  delete_file: Boolean
}

type FindStoriesResultType {
  count: Int!
  stories: [Story!]!
}
