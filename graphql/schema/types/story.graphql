type StoryPathsType {
  """
  The story's text, served as plain text: its text file's, or else the text stored
  with it. Null when it has neither.
  """
  text: String # Resolver
}

"A story, kept in a text file or with its text stored in the library"
type Story {
  id: ID!
  title: String
  author: String
  source_website: String
  urls: [String!]!
  date: String
  language: String
  details: String
  tagline: String
  "The current user's own rating, expressed as 1-100"
  rating100: Int
  created_at: Time!
  updated_at: Time!

  files: [BasicFile!]!
  paths: StoryPathsType! # Resolver
  tags: [Tag!]!
}

input StoryCreateInput {
  title: String
  author: String
  source_website: String
  urls: [String!]
  date: String
  "The current user's own rating, expressed as 1-100"
  rating100: Int
  language: String
  details: String
  tagline: String
  tag_ids: [ID!]
  """
  The story's text, for a story without a text file, such as one scraped from a
  website. Can't be set with file_ids: a story with a text file shows the file's text.
  """
  text: String

  """
  The first id will be assigned as primary.
  Files must not already be primary for another object.
  """
  file_ids: [ID!]
}

input StoryUpdateInput {
  id: ID!
  title: String
  author: String
  source_website: String
  urls: [String!]
  date: String
  "The current user's own rating, expressed as 1-100"
  rating100: Int
  language: String
  details: String
  tagline: String
  tag_ids: [ID!]
  """
  The story's text, for a story without a text file. An empty string removes it.
  Can't be set for a story with a text file, which shows the file's text.
  """
  text: String

  primary_file_id: ID
}

input StoriesDestroyInput {
  "Removes the stories from the library. Their files are kept."
  ids: [ID!]!
}

type FindStoriesResultType {
  count: Int!
  stories: [Story!]!
}
