query FindStories($filter: FindFilterType, $story_filter: StoryFilterType) {
  findStories(filter: $filter, story_filter: $story_filter) {
    count
    stories {
      ...SlimStoryData
    }
  }
}

query FindStory($id: ID!) {
  findStory(id: $id) {
    ...StoryData
  }
}

# stories that may have this web address: Equals matches without case and
# treats _ and % as wildcards, so the caller compares the addresses itself
query FindStoriesByURL($url: String!) {
  findStories(
    filter: { per_page: 25 }
    story_filter: { url: { value: $url, modifier: EQUALS } }
  ) {
    stories {
      id
      title
      urls
    }
  }
}
