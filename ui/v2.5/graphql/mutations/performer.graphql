mutation PerformerCreate($input: PerformerCreateInput!) {
  performerCreate(input: $input) {
    ...PerformerData
  }
}

mutation PerformerUpdate($input: PerformerUpdateInput!) {
  performerUpdate(input: $input) {
    ...PerformerData
  }
}

mutation BulkPerformerUpdate($input: BulkPerformerUpdateInput!) {
  bulkPerformerUpdate(input: $input) {
    ...PerformerData
  }
}

mutation PerformerDestroy($id: ID!) {
  performerDestroy(input: { id: $id })
}

mutation PerformersDestroy($ids: [ID!]!) {
  performersDestroy(ids: $ids)
}

mutation PerformerMerge($input: PerformerMergeInput!) {
  performerMerge(input: $input) {
    id
  }
}

mutation PerformerUserDataUpdate($input: UserRatingFavoriteInput!) {
  performerUserDataUpdate(input: $input) {
    ...PerformerData
  }
}

mutation PerformerImageAdd($id: ID!, $image: String!) {
  performerImageAdd(id: $id, image: $image) {
    id
    image_path
  }
}

mutation PerformerImageRemove($id: ID!, $checksum: String!) {
  performerImageRemove(id: $id, checksum: $checksum) {
    id
    image_path
  }
}

mutation PerformerImageSetPrimary($id: ID!, $checksum: String!) {
  performerImageSetPrimary(id: $id, checksum: $checksum) {
    id
    image_path
  }
}

mutation PerformerImagesReorder($id: ID!, $checksums: [String!]!) {
  performerImagesReorder(id: $id, checksums: $checksums) {
    id
    image_path
  }
}
