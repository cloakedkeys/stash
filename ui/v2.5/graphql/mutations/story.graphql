mutation StoryCreate($input: StoryCreateInput!) {
  storyCreate(input: $input) {
    id
  }
}

mutation StoryUpdate($input: StoryUpdateInput!) {
  storyUpdate(input: $input) {
    ...StoryData
  }
}

mutation StoryUserDataUpdate($input: StoryUserRatingInput!) {
  storyUserDataUpdate(input: $input) {
    ...StoryData
  }
}

mutation StoryAssignFile($input: AssignStoryFileInput!) {
  storyAssignFile(input: $input)
}

mutation StoriesDestroy($ids: [ID!]!, $delete_file: Boolean) {
  storiesDestroy(input: { ids: $ids, delete_file: $delete_file })
}
