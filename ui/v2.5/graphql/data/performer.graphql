fragment PerformerDetails on Performer {
  id
  name
  disambiguation
  urls
  gender
  birthdate
  ethnicity
  country
  eye_color
  height_cm
  measurements
  fake_tits
  penis_length
  circumcised
  career_start
  career_end
  tattoos
  piercings
  alias_list
  favorite
  organized
  ignore_auto_tag
  image_path
  performer_count

  tags {
    ...SlimTagData
  }

  stash_ids {
    stash_id
    endpoint
    updated_at
  }
  rating100
  details
  death_date
  hair_color
  weight

  custom_fields
}

fragment PerformerData on Performer {
  ...PerformerDetails
  o_counter
  scene_count
  audio_count
  image_count
  gallery_count
  group_count
}

fragment PerformerListData on Performer {
  ...PerformerDetails
  o_counter(studio_scope: $studio_scope)
  scene_count(studio_scope: $studio_scope)
  audio_count(studio_scope: $studio_scope)
  image_count(studio_scope: $studio_scope)
  gallery_count(studio_scope: $studio_scope)
  group_count(studio_scope: $studio_scope)
}
