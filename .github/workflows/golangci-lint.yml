name: Lint (golangci-lint)
on:
  push:
    tags:
      - v*
    branches:
      - master
      - develop
      - 'releases/**'
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  # every commit on a shared branch still gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/docs-only.yml

  golangci:
    name: lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # no tags or depth needed for lint
      - uses: actions/checkout@v6
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-name: lint

      # generate-backend runs natively (just go generate + touch-ui) — no Docker needed
      - name: Generate Backend
        run: make generate-backend

      ## WARN
      ## using v1, update in a later PR
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

      - name: Save Go cache
        uses: ./.github/actions/save-go-cached
        with:
          key: ${{ steps.go.outputs.key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}
