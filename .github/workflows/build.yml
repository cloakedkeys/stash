name: Build

on:
  push:
    branches:
      - develop
      - master
      - 'releases/**'
    tags:
      - 'v*'
  pull_request:
    # ready_for_review: drafts skip every check, so run them when one is marked ready
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.ref }}
  # Only cancel pull requests, so pushes to develop keep all results:
  # every commit on a shared branch still gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPILER_IMAGE: ghcr.io/stashapp/compiler:14

jobs:
  # Says whether a pull request leaves the Go code alone: it only changes documentation and the
  # web UI (ui/v2.5, but not its translations, which the login page uses). The Go checks skip it
  # then. Anything else, including this check failing, means they run. Jobs using this must
  # compare with != 'true', so that an empty answer runs them too.
  # Draft pull requests skip this, as they skip every check.
  changes:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      go_unchanged: ${{ steps.check.outputs.go_unchanged }}
    steps:
    # a pull request's commit here is a merge, and its first parent is the branch it merges into
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2

    - id: check
      run: |
        go_unchanged=false
        files=""
        if git rev-parse --verify --quiet HEAD^2 > /dev/null \
          && files=$(git diff --no-renames --name-only HEAD^1 HEAD) \
          && [ -n "$files" ]; then
          # grep exits 1 only when every file matched. 0 means some didn't, and 2 is an error.
          status=0
          printf '%s\n' "$files" | grep -qvE '^(ui/v2\.5/.*|[^/]+\.md)$' || status=$?
          if [ "$status" -eq 1 ] && ! printf '%s\n' "$files" | grep -qE '^ui/v2\.5/src/locales/'; then
            go_unchanged=true
          fi
        fi
        printf '%s\n' "$files"
        echo "Go unchanged: $go_unchanged"
        echo "go_unchanged=$go_unchanged" >> "$GITHUB_OUTPUT"

  # Job 1: Generate code and build UI
  # Runs natively (no Docker) — go generate/gqlgen and node don't need cross-compilers.
  # Produces artifacts (generated Go files + UI build) consumed by test and build jobs.
  generate:
    # A draft pull request skips every check; marking it ready runs them.
    # Tag pushes previously ran only lint.
    if: ${{ !github.event.pull_request.draft && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Setup Go
      id: go
      uses: ./.github/actions/setup-go-cached
      with:
        cache-name: generate

    # pnpm version is read from the packageManager field in package.json
    # very broken (4.3, 4.4)
    - name: Install pnpm
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      with:
        package_json_file: ui/v2.5/package.json

    # ensure pnpm store path exists to fix post setup node.js error
    # https://github.com/actions/setup-node/issues/1137#issuecomment-2508963254
    - name: Ensure pnpm store path exists
      run: |
        PNPM_STORE_PATH="$( pnpm store path --silent )"
        if [ ! -d "$PNPM_STORE_PATH" ]; then
          echo "PNPM store directory does not exist, creating it."
          mkdir -p "$PNPM_STORE_PATH"
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: ui/v2.5/pnpm-lock.yaml

    - name: Install UI dependencies
      run: make pre-ui

    - name: Generate
      run: make generate

    - name: Test UI
      working-directory: ui/v2.5
      run: pnpm run test

    - name: Cache UI build
      uses: actions/cache/restore@v5
      id: cache-ui
      with:
        path: ui/v2.5/build
        key: ${{ runner.os }}-ui-build-${{ hashFiles('ui/v2.5/pnpm-lock.yaml', 'ui/v2.5/public/**', 'ui/v2.5/src/**', 'graphql/**/*.graphql') }}

    - name: Validate UI
      # skip UI validation for pull requests if UI is unchanged
      if: ${{ github.event_name != 'pull_request' || steps.cache-ui.outputs.cache-hit != 'true' }}
      run: make validate-ui

    - name: Build UI
      # skip UI build for pull requests if UI is unchanged (UI was cached)
      if: ${{ github.event_name != 'pull_request' || steps.cache-ui.outputs.cache-hit != 'true' }}
      run: make ui

    # Only develop pushes save caches that other pull requests can restore.
    - name: Save UI build cache
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.cache-ui.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ui/v2.5/build
        key: ${{ steps.cache-ui.outputs.cache-primary-key }}

    # Bundle generated Go files + UI build for downstream jobs (test + build)
    - name: Upload generated artifacts
      uses: actions/upload-artifact@v7
      with:
        name: generated
        retention-days: 1
        path: |
          internal/api/generated_exec.go
          internal/api/generated_models.go
          ui/v2.5/build/
          ui/login/locales/

    - name: Save Go cache
      uses: ./.github/actions/save-go-cached
      with:
        key: ${{ steps.go.outputs.key }}
        cache-hit: ${{ steps.go.outputs.cache-hit }}

  # Job 2: Integration tests
  # Runs natively (no Docker) — only needs Go + GCC (for CGO/SQLite), both on ubuntu-22.04.
  # Runs in parallel with the build matrix jobs.
  # A pull request that only changes documentation or the web UI skips this. It still needs
  # generate, which builds the documentation into the UI and runs the UI's tests.
  test:
    needs: [changes, generate]
    if: ${{ !cancelled() && needs.generate.result == 'success' && needs.changes.outputs.go_unchanged != 'true' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      id: go
      uses: ./.github/actions/setup-go-cached
      with:
        cache-name: test

    # Places generated Go files + UI build into the working tree so the build compiles
    - name: Download generated artifacts
      uses: actions/download-artifact@v8
      with:
        name: generated

    # -count=1 so the cache only saves compiling, and every test really runs
    - name: Test Backend
      env:
        GOFLAGS: -count=1
      run: make it

    - name: Save Go cache
      uses: ./.github/actions/save-go-cached
      with:
        key: ${{ steps.go.outputs.key }}
        cache-hit: ${{ steps.go.outputs.cache-hit }}

  # Job 3: Cross-compile for all platforms
  # Each platform gets its own runner and Docker container (ghcr.io/stashapp/compiler:13).
  # Each build-cc-* make target is self-contained (sets its own GOOS/GOARCH/CC),
  # so running them in separate containers is functionally identical to one container.
  # Runs in parallel with the test job.
  # Not run for pull requests or develop: it takes most of the free monthly
  # minutes on a private repository, and the test job covers those.
  build:
    needs: generate
    if: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: windows
          make-target: build-cc-windows
          artifact-paths: |
            dist/stash-win.exe
          tag: win
        - platform: macos
          make-target: build-cc-macos
          artifact-paths: |
            dist/stash-macos
            dist/Stash.app.zip
          tag: osx
        - platform: linux
          make-target: build-cc-linux
          artifact-paths: |
            dist/stash-linux
          tag: linux
        - platform: linux-arm64v8
          make-target: build-cc-linux-arm64v8
          artifact-paths: |
            dist/stash-linux-arm64v8
          tag: arm
        - platform: linux-arm32v7
          make-target: build-cc-linux-arm32v7
          artifact-paths: |
            dist/stash-linux-arm32v7
          tag: arm
        - platform: linux-arm32v6
          make-target: build-cc-linux-arm32v6
          artifact-paths: |
            dist/stash-linux-arm32v6
          tag: arm
        - platform: freebsd
          make-target: build-cc-freebsd
          artifact-paths: |
            dist/stash-freebsd
          tag: freebsd

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Download generated artifacts
      uses: actions/download-artifact@v8
      with:
        name: generated

    - name: Cache Go build
      uses: actions/cache@v5
      with:
        path: .go-cache
        key: ${{ runner.os }}-go-cache-${{ matrix.platform }}-${{ hashFiles('go.mod', '**/go.sum') }}

    # kept separate to test timings
    - name: pull compiler image
      run: docker pull $COMPILER_IMAGE

    - name: Start build container
      env:
        official-build: ${{ github.repository == 'stashapp/stash' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'release' && github.ref != 'refs/tags/latest_develop')) }}
      run: |
        mkdir -p .go-cache
        docker run -d --name build --mount type=bind,source="$(pwd)",target=/stash,consistency=delegated --mount type=bind,source="$(pwd)/.go-cache",target=/root/.cache/go-build,consistency=delegated --env OFFICIAL_BUILD=${{ env.official-build }} --env UPDATE_REPO=${{ github.repository }} -w /stash $COMPILER_IMAGE tail -f /dev/null

    - name: Build (${{ matrix.platform }})
      run: docker exec -t build /bin/bash -c "make ${{ matrix.make-target }}"

    - name: Cleanup build container
      run: docker rm -f -v build

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.platform }}
        retention-days: 1
        path: ${{ matrix.artifact-paths }}

  # Job 4: Release
  # Waits for both test and build to pass, then collects all platform artifacts
  # into dist/ for checksums, GitHub releases, and multi-arch Docker push.
  release:
    needs: [test, build]
    # spelled out, because the default also needs test's own needs to have passed, and a failed
    # check for documentation-only changes shouldn't stop a release
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    # Downloads all artifacts (generated + 7 platform builds) into artifacts/ subdirectories
    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    # Reassemble platform binaries from matrix job artifacts into a single dist/ directory
    # make sure that artifacts have executable bit set
    # upload-artifact@v4 strips the common path prefix (dist/), so files are at the artifact root
    - name: Collect binaries
      run: |
        mkdir -p dist
        cp artifacts/build-*/* dist/
        chmod +x dist/*

    - name: Zip UI
      run: |
        cd artifacts/generated/ui/v2.5/build && zip -r ../../../../../dist/stash-ui.zip .

    - name: Generate checksums
      run: |
        git describe --tags --exclude latest_develop | tee CHECKSUMS_SHA1
        sha1sum dist/Stash.app.zip dist/stash-* dist/stash-ui.zip | sed 's/dist\///g' | tee -a CHECKSUMS_SHA1
        echo "STASH_VERSION=$(git describe --tags --exclude latest_develop)" >> $GITHUB_ENV
        echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV

    - name: Upload Windows binary
      # only upload binaries for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: stash-win.exe
        path: dist/stash-win.exe

    - name: Upload macOS binary
      # only upload binaries for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: stash-macos
        path: dist/stash-macos

    - name: Upload macOS bundle
      # only upload binaries for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: Stash.app.zip
        path: dist/Stash.app.zip

    - name: Upload Linux binary
      # only upload binaries for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: stash-linux
        path: dist/stash-linux

    - name: Upload UI
      # only upload for pull requests
      if: ${{ github.event_name == 'pull_request' && github.base_ref != 'refs/heads/develop' && github.base_ref != 'refs/heads/master'}}
      uses: actions/upload-artifact@v7
      with:
        name: stash-ui.zip
        path: dist/stash-ui.zip

    - name: Update latest_develop tag
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      run: git tag -f latest_develop; git push -f --tags

    - name: Development Release
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      uses: marvinpinto/action-automatic-releases@v1.1.2
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: true
        automatic_release_tag: latest_develop
        title: "${{ env.STASH_VERSION }}: Latest development build"
        files: |
          dist/Stash.app.zip
          dist/stash-macos
          dist/stash-win.exe
          dist/stash-linux
          dist/stash-linux-arm64v8
          dist/stash-linux-arm32v7
          dist/stash-linux-arm32v6
          dist/stash-freebsd
          dist/stash-ui.zip
          CHECKSUMS_SHA1

    - name: Master release
      # NOTE: this isn't perfect, but should cover most scenarios
      # DON'T create tag names starting with "v" if they are not stable releases
      if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
      uses: WithoutPants/github-release@v2.0.4
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        allow_override: true
        files: |
          dist/Stash.app.zip
          dist/stash-macos
          dist/stash-win.exe
          dist/stash-linux
          dist/stash-linux-arm64v8
          dist/stash-linux-arm32v7
          dist/stash-linux-arm32v6
          dist/stash-freebsd
          dist/stash-ui.zip
          CHECKSUMS_SHA1
        gzip: false

    - name: Development Docker
      if: ${{ github.repository == 'stashapp/stash' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      env:
        DOCKER_CLI_EXPERIMENTAL: enabled
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        docker run --rm --privileged tonistiigi/binfmt
        docker info
        docker buildx create --name builder --use
        docker buildx inspect --bootstrap
        docker buildx ls
        bash ./docker/ci/x86_64/docker_push.sh development

    - name: Release Docker
      # NOTE: this isn't perfect, but should cover most scenarios
      # DON'T create tag names starting with "v" if they are not stable releases
      if: ${{ github.repository == 'stashapp/stash' && github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
      env:
        DOCKER_CLI_EXPERIMENTAL: enabled
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        docker run --rm --privileged tonistiigi/binfmt
        docker info
        docker buildx create --name builder --use
        docker buildx inspect --bootstrap
        docker buildx ls
        bash ./docker/ci/x86_64/docker_push.sh latest "${{ github.event.release.tag_name }}"

  lint:
    name: lint
    needs: changes
    # Published releases previously ran only the Build jobs.
    if: ${{ github.event_name != 'release' && !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.go_unchanged != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # no tags or depth needed for lint
      - uses: actions/checkout@v6
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-name: lint

      # generate-backend runs natively (just go generate + touch-ui) — no Docker needed
      - name: Generate Backend
        run: make generate-backend

      ## WARN
      ## using v1, update in a later PR
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

      - name: Save Go cache
        uses: ./.github/actions/save-go-cached
        with:
          key: ${{ steps.go.outputs.key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  # A required check: a skipped job counts as passed.
  test-postgres:
    needs: changes
    # Tag pushes and published releases did not trigger Test Postgres.
    if: ${{ github.event_name != 'release' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.go_unchanged != 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --name postgres-db
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      id: go
      uses: ./.github/actions/setup-go-cached
      with:
        cache-name: postgres

    - name: Generate Backend
      run: make generate-backend

    # backup tests run pg_dump and pg_restore, which must be as new as the server
    - name: Install PostgreSQL client tools
      run: |
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-18
        echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

    # an ordinary account, as the manual describes, so Stash can't come to need more
    # without a test failing. It can create databases only because some tests do.
    - name: Create an ordinary database account
      run: |
        docker exec postgres-db psql -U username -d testdb -c "CREATE ROLE stash LOGIN PASSWORD 'password' CREATEDB"
        docker exec postgres-db psql -U username -d testdb -c "CREATE DATABASE stash_test OWNER stash"

    # one package at a time, since they share the database
    - name: Test
      env:
        PGSQL_TEST: 'postgresql://stash:password@localhost:5432/stash_test?sslmode=disable'
      run: go test -count=1 -p 1 -tags "sqlite_stat4 sqlite_math_functions integration" -skip 'TestMigrateFromSQLite' ./pkg/database ./pkg/postgres

    # the only thing that needs an extra permission, and the manual says to grant it
    - name: Test copying from SQLite
      env:
        PGSQL_TEST: 'postgresql://stash:password@localhost:5432/stash_test?sslmode=disable'
      run: |
        docker exec postgres-db psql -U username -d testdb -c "GRANT SET ON PARAMETER session_replication_role TO stash"
        go test -count=1 -tags "sqlite_stat4 sqlite_math_functions integration" -run 'TestMigrateFromSQLite' ./pkg/postgres

    - name: Save Go cache
      uses: ./.github/actions/save-go-cached
      with:
        key: ${{ steps.go.outputs.key }}
        cache-hit: ${{ steps.go.outputs.cache-hit }}
