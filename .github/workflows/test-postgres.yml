name: Test Postgres

on:
  push:
    branches:
      - develop
      - master
      - 'releases/**'
  pull_request:

concurrency:
  group: test-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --name postgres-db
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Generate Backend
      run: make generate-backend

    # migrations create functions in plperl
    - name: Install plperl in postgres container
      run: |
        docker exec postgres-db apt-get update
        docker exec postgres-db apt-get install -y postgresql-plperl-18

    # backup tests run pg_dump and pg_restore, which must be as new as the server
    - name: Install PostgreSQL client tools
      run: |
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-18
        echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

    # one package at a time, since they share the database
    - name: Test
      env:
        PGSQL_TEST: 'postgresql://username:password@localhost:5432/testdb?sslmode=disable'
      run: go test -count=1 -p 1 -tags "sqlite_stat4 sqlite_math_functions integration" ./pkg/database ./pkg/postgres
