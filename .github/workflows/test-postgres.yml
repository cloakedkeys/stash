name: Test Postgres

on:
  push:
    branches:
      - develop
      - master
      - 'releases/**'
  pull_request:

concurrency:
  group: test-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/docs-only.yml

  # A required check: a skipped job counts as passed.
  test-postgres:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --name postgres-db
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      id: go
      uses: ./.github/actions/setup-go-cached
      with:
        cache-name: postgres

    - name: Generate Backend
      run: make generate-backend

    # backup tests run pg_dump and pg_restore, which must be as new as the server
    - name: Install PostgreSQL client tools
      run: |
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-18
        echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

    # an ordinary account, as the manual describes, so Stash can't come to need more
    # without a test failing. It can create databases only because some tests do.
    - name: Create an ordinary database account
      run: |
        docker exec postgres-db psql -U username -d testdb -c "CREATE ROLE stash LOGIN PASSWORD 'password' CREATEDB"
        docker exec postgres-db psql -U username -d testdb -c "CREATE DATABASE stash_test OWNER stash"

    # one package at a time, since they share the database
    - name: Test
      env:
        PGSQL_TEST: 'postgresql://stash:password@localhost:5432/stash_test?sslmode=disable'
      run: go test -count=1 -p 1 -tags "sqlite_stat4 sqlite_math_functions integration" -skip 'TestMigrateFromSQLite' ./pkg/database ./pkg/postgres

    # the only thing that needs an extra permission, and the manual says to grant it
    - name: Test copying from SQLite
      env:
        PGSQL_TEST: 'postgresql://stash:password@localhost:5432/stash_test?sslmode=disable'
      run: |
        docker exec postgres-db psql -U username -d testdb -c "GRANT SET ON PARAMETER session_replication_role TO stash"
        go test -count=1 -tags "sqlite_stat4 sqlite_math_functions integration" -run 'TestMigrateFromSQLite' ./pkg/postgres

    - name: Save Go cache
      uses: ./.github/actions/save-go-cached
      with:
        key: ${{ steps.go.outputs.key }}
        cache-hit: ${{ steps.go.outputs.cache-hit }}
